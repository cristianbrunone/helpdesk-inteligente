site_name: HelpDesk Inteligente
site_description: Documentação técnica, arquitetura de software (C4), 27 ADRs, métricas de IA (evals), testes e jornada de desenvolvimento.
site_author: Cristian Brunone
site_url: https://cristianbrunone.github.io/helpdesk-inteligente/
repo_name: cristianbrunone/helpdesk-inteligente
repo_url: https://github.com/cristianbrunone/helpdesk-inteligente

docs_dir: docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Arquitetura & Design:
      - Visão Geral (C4): 02-add.md
      - Requisitos de Negócio: 01-requisitos.md
      - Modelo de Dados: 03-modelo-de-dados.md
      - Contratos da API: 04-contratos-api.md
      - Enunciado Original: 00-enunciado.md
  - Decisões (ADRs):
      - Catálogo de Decisões: decisoes.md
      - Template de ADR: adr/0000-template.md
      - 0001 · Monólito Modular: adr/0001-monolito-modular.md
      - 0002 · Clean Architecture: adr/0002-clean-architecture-pragmatica.md
      - 0003 · Fila em Tabela PostgreSQL: adr/0003-fila-em-tabela-postgres.md
      - 0004 · Triagem Pipeline RAG: adr/0004-triagem-pipeline-rag-deterministico.md
      - 0005 · Abstração Provedor LLM: adr/0005-abstracao-provedor-llm.md
      - 0006 · Gemini Free Tier e LGPD: adr/0006-gemini-free-tier-e-lgpd.md
