# HelpDesk Inteligente — ambiente completo com um comando (NFR-08, ADD §12):
#   docker compose up --build
# Sobe SEM arquivo .env: todo valor tem padrão aqui. O .env (opcional, fora do git) só sobrescreve.
# A IA usa o provedor fake por padrão; nenhuma chave de API é necessária.

name: helpdesk

# GSS Encryption Mode=Disable: sem Kerberos no projeto, e a imagem Alpine não tem a libgssapi (evita um
# aviso fora do JSON nos logs a cada conexão nova).
x-banco: &banco
  ConnectionStrings__Default: >-
    Host=db;Port=5432;Database=${POSTGRES_DB:-helpdesk};Username=${POSTGRES_USER:-helpdesk};Password=${POSTGRES_PASSWORD:-helpdesk_dev};GSS Encryption Mode=Disable

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk_dev}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    volumes:
      # PostgreSQL 18+: o volume vai em /var/lib/postgresql (o PGDATA fica num subdiretório por versão).
      - pgdata:/var/lib/postgresql
    ports:
      # Exposto só para inspeção local (psql, IDE). Porta alternativa para não colidir com um Postgres local.
      - "${DB_PORTA_HOST:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    build:
      context: .
      target: migrator
      secrets: [ca_extra]
    environment:
      <<: *banco
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
      secrets: [ca_extra]
    environment:
      <<: *banco
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      IA_TRIAGEM_HABILITADA: ${IA_TRIAGEM_HABILITADA:-true}
      IA_COPILOTO_HABILITADO: ${IA_COPILOTO_HABILITADO:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${API_PORTA_HOST:-5080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
      secrets: [ca_extra]
    environment:
      <<: *banco
      IA_TRIAGEM_HABILITADA: ${IA_TRIAGEM_HABILITADA:-true}
      # Provedor de IA (ADR-0005): fake por padrão. Valores vazios valem o padrão do código.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-}
      LLM_FAKE_MODO: ${LLM_FAKE_MODO:-}
      LLM_FAKE_ATRASO_MS: ${LLM_FAKE_ATRASO_MS:-}
      TRIAGEM_MAX_TOKENS_SAIDA: ${TRIAGEM_MAX_TOKENS_SAIDA:-}
      # Fila (ADR-0003)
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      secrets: [ca_extra]
    ports:
      - "${WEB_PORTA_HOST:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Painel de traces (ADR-0019), opcional: só sobe com o profile.
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889 docker compose --profile observabilidade up
  # Interface em http://localhost:18888, sem login: é local e efêmero (nada fica gravado), só para desenvolvimento.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.0
    # A imagem 13.6.0 traz o painel como executável nativo, mas o entrypoint dela ainda aponta para
    # "dotnet /app/Aspire.Dashboard.dll", que não existe: sem esta linha, o contêiner reinicia em loop.
    entrypoint: ["/app/Aspire.Dashboard"]
    profiles: [observabilidade]
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "${ASPIRE_PORTA_HOST:-18888}:18888"
    restart: unless-stopped

volumes:
  pgdata:

# CA extra opcional para redes com inspeção TLS (veja o README). Sem CA_EXTRA_PEM, usa um arquivo vazio.
secrets:
  ca_extra:
    file: ${CA_EXTRA_PEM:-./docker/ca-extra-vazia.pem}
