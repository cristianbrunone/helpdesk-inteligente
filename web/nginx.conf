# SPA + proxy da API na mesma origem (ADD §12).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Copiloto conversacional (ADR-0012): streaming SSE sem buffering para entrega em tempo real.
    location ~ ^/api/chamados/[^/]+/copiloto$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # /api/* vai para a API sem reescrever o caminho. Sem gzip: ao comprimir, o Nginx troca o ETag forte da API
    # por um fraco (W/"..."), e o If-Match das escritas (comparação forte, RFC 9110) passaria a dar 412 sempre.
    location /api/ {
        gzip off;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome: cache longo (o nome muda a cada build).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rotas do React Router: qualquer outro caminho devolve o index.html, sem cache.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
