# CI (ADR-0022): três jobs paralelos — backend, frontend e smoke test do docker compose.
# Nenhum segredo: a IA fica no fake e os testes com provedor real não rodam aqui (ADR-0023).
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  LLM_PROVIDER: fake

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Cache do NuGet
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore HelpDesk.slnx

      - name: Formatação (dotnet format)
        run: dotnet format HelpDesk.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build HelpDesk.slnx --no-restore --configuration Release

      # Cobertura com o Coverlet (MTP): um relatório por projeto de teste, unidos pelo scripts/cobertura.mjs.
      - name: Testes (unitários, integração com Testcontainers e arquitetura) com cobertura
        run: >-
          dotnet test --no-build --configuration Release --filter "Category!=ProvedorReal"
          --results-directory "${{ runner.temp }}/cobertura"
          --coverlet --coverlet-output-format cobertura --coverlet-include "[HelpDesk.*]*"
          --coverlet-exclude "[HelpDesk.Infrastructure]HelpDesk.Infrastructure.Migrations.*"

      - name: Resumo da cobertura do backend
        run: |
          echo "### Cobertura do backend (linhas)" >> "$GITHUB_STEP_SUMMARY"
          node scripts/cobertura.mjs "${{ runner.temp }}/cobertura" --markdown >> "$GITHUB_STEP_SUMMARY"

      # ADR-0018: no CI o harness roda com o fake e uma repetição. Não mede qualidade; garante que ele funciona.
      - name: Smoke do harness de evals (fake, sem RAG)
        env:
          LLM_PROVIDER: fake
        run: >-
          dotnet run --project tools/HelpDesk.Evals --no-build --configuration Release --
          --rag off --repeticoes 1 --saida "${{ runner.temp }}/evals"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalação
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Testes (Vitest) com cobertura
        run: npm run test:cobertura

      - name: Resumo da cobertura do frontend
        run: >-
          node -e "const t=require('./coverage/coverage-summary.json').total;
          const l=k=>'| '+k+' | '+t[k].covered+'/'+t[k].total+' | '+t[k].pct+'% |';
          console.log(['### Cobertura do frontend','| Métrica | Cobertos | % |','|---|---:|---:|',
          l('lines'),l('statements'),l('branches'),l('functions')].join('\n'))" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

  compose:
    name: Smoke (docker compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Sobe o ambiente sem .env (clone limpo, DoD item 1)
        run: |
          test ! -f .env
          docker compose up --build --detach --wait --wait-timeout 300

      - name: Verifica os critérios de aceite
        run: bash scripts/smoke-compose.sh

      # E2E (enunciado §7): o navegador fala com o mesmo ambiente de pé, pelo Nginx, com a IA fake.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: E2E (Playwright, Chromium) triagem, copiloto e telas em 375 px
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Logs dos serviços (em caso de falha)
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v
